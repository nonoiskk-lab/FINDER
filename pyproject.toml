[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-it-tender-intelligence"
version = "1.0.0"
description = "Daily discovery, verification, analysis and reporting of official GeM IT tenders relevant to Jharkhand"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6.0,<7",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]

[project.scripts]
gem-intel = "gem_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008", "SIM108", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
